<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Criptgrafia</title>
</head>
<body>
    <h1>Faça cadastro e login</h1>
    <hr>
    <section>
        <h2>cadastro</h2>
        <input id="cadNome", placeholder="Digite o seu nome" required>
        <input id="cadEmail", type="email" placeholder="Digite o seu email" required>
        <input id="cadSenha", type="password" placeholder="Digite a sua senha" required>
        <button id="btnCad">Cadastrar</button>
    </section>

    <section>
        <input id="loginSenha", placeholder="Digite o seu nome", required>
        <input id="loginEmail", type="email" placeholder="Digite o seu email", required>
        <input id="loginSenha", type="password" placeholder="Digite a sua senha", required>
        <button id="btnLogin">Login</button>
    </section>

    <section>
        <h2>Alunos cadastrados</h2>
        <div id="dados"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
